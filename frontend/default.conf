server {
    listen 80;

    # Serve the page. A request for / reads index.html from this directory.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # The browser calls /api on this container. Forward that path unchanged
    # to the backend service on the Compose network.
    # No URI after the port, so /api/v1/hello stays /api/v1/hello.
    location /api/ {
        proxy_pass http://backend:5001;
    }
}
