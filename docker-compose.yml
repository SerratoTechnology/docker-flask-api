version: '3'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - api
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Nginx substitutes this into the proxy at startup.
    # Here the Frontend reaches the Backend by its Compose service name.
    # On Fargate, both containers share the task network, so this value
    # is localhost:5001 instead. The image stays the same.
    environment:
      BACKEND_UPSTREAM: backend:5001
    ports:
      - 8081:80
    depends_on:
      - backend
    networks:
      - api

networks:
  api: